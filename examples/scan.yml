# Copy to .github/workflows/sensitivity-smell.yml in the repository to scan.
# Start with reports and assign a reviewer; findings are possible sensitive data.
# This published v1.1.0 example includes common field extraction and GC flags.
# Rebranded report identifiers require a later release or reviewed commit.
# For production, pin the action to the full commit SHA you reviewed.
# fail-on sets check failure; repository rules separately control merge gating.
name: Sensitivity Smell
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Scan
        id: sensitive
        uses: KingBain/sensitivity-smell@v1.1.0
        with:
          profile: code
          fail-on: NONE
      - name: Preserve reports
        if: ${{ always() && steps.sensitive.outputs.report-directory != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sensitivity-smell-results
          path: ${{ steps.sensitive.outputs.report-directory }}
          retention-days: 7
          if-no-files-found: error

# This manual demo should finish green with zero findings.
# The fixture is synthetic, committed only in a temporary local repository.
name: Example - passing scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create a committed synthetic fixture
        id: fixture
        shell: bash
        run: |
          DEMO_REPO="$(mktemp -d "$RUNNER_TEMP/sensitivity-demo.XXXXXX")"
          cp "examples/fixtures/passing.txt" "$DEMO_REPO/record.txt"
          git -C "$DEMO_REPO" init --quiet
          git -C "$DEMO_REPO" add record.txt
          git -C "$DEMO_REPO" -c user.name="Scanner Demo" -c user.email="demo@example.invalid" commit --quiet -m "Synthetic fixture"
          echo "repository=$DEMO_REPO" >> "$GITHUB_OUTPUT"

      - name: Scan the fixture
        id: sensitive
        uses: KingBain/sensitivity-scan@v1.0.0
        with:
          repository: ${{ steps.fixture.outputs.repository }}
          mode: full
          fail-on: HIGH

      - name: Verify the fixture is clean
        env:
          FINDINGS: ${{ steps.sensitive.outputs.findings-count }}
        run: test "$FINDINGS" = "0"

      - name: Preserve reports
        if: ${{ always() && steps.sensitive.outputs.report-directory != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: passing-scan-reports
          path: ${{ steps.sensitive.outputs.report-directory }}
          retention-days: 7
          if-no-files-found: error
